# Check-in reminders ("Still in Brno?"). Every hour this asks the live site
# to send the reminders that are due; the site decides who (people in their
# evening who haven't logged for their chosen interval).
#
# Needs (repo Settings → Secrets and variables → Actions):
#   secret   CRON_SECRET  the same value as CRON_SECRET in Vercel
#   variable APP_URL      the live site, e.g. https://elektricky.vercel.app
#                         (not secret, so it stays readable in the logs)
name: Check-in reminders

on:
  schedule:
    - cron: '7 * * * *' # every hour (a few minutes past, when GitHub is less busy)
  workflow_dispatch: {}

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        # Counts only ({"checked":5,"due":1,"sent":1}); the log is public.
        # Also shown on the run's Summary page.
        run: |
          # ${APP_URL%/}: works with or without a slash at the end.
          result=$(curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/reminders") || { echo "$result"; exit 1; }
          echo "$result"
          # Anything but the counts (e.g. a redirect page) means it didn't run.
          case "$result" in
            *'"checked"'*) ;;
            *) echo "::error::Unexpected answer from the site"; exit 1 ;;
          esac
          echo "Reminders: \`$result\`" >> "$GITHUB_STEP_SUMMARY"
